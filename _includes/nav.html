<dialog class="theme-sheet" id="themeSheet" aria-labelledby="themeSheetTitle">
    <div class="theme-sheet__content">
        <div class="theme-sheet__header">
            <div>
                <p class="theme-sheet__eyebrow">PERSONALIZE</p>
                <h2 id="themeSheetTitle">Choose a theme</h2>
            </div>
            <button class="theme-sheet__close" type="button" aria-label="Close theme chooser">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="theme-sheet__options" role="group" aria-label="Color themes">
            <button class="theme-sheet__option" type="button" data-theme-choice="light" aria-pressed="true"><span class="theme-sheet__swatch theme-sheet__swatch--light" aria-hidden="true"></span><span>Light</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
            <button class="theme-sheet__option" type="button" data-theme-choice="dark" aria-pressed="false"><span class="theme-sheet__swatch theme-sheet__swatch--dark" aria-hidden="true"></span><span>Dark</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
            <button class="theme-sheet__option" type="button" data-theme-choice="auto" aria-pressed="false"><span class="theme-sheet__swatch theme-sheet__swatch--auto" aria-hidden="true"></span><span>System Auto</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
            <button class="theme-sheet__option" type="button" data-theme-choice="sepia" aria-pressed="false"><span class="theme-sheet__swatch theme-sheet__swatch--sepia" aria-hidden="true"></span><span>Sepia</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
            <button class="theme-sheet__option" type="button" data-theme-choice="ocean" aria-pressed="false"><span class="theme-sheet__swatch theme-sheet__swatch--ocean" aria-hidden="true"></span><span>Ocean</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
            <button class="theme-sheet__option" type="button" data-theme-choice="forest" aria-pressed="false"><span class="theme-sheet__swatch theme-sheet__swatch--forest" aria-hidden="true"></span><span>Forest</span><span class="theme-sheet__check" aria-hidden="true">✓</span></button>
        </div>
    </div>
</dialog>
